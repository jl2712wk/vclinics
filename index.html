<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicalV - Acceso Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #f0f9ff; }
        
        /* Animaciones */
        .recording-main { animation: pulse-main 1.5s infinite; background-color: #ef4444 !important; }
        @keyframes pulse-main { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
        
        .mic-active { color: #ef4444 !important; animation: pulse-mini 1s infinite; }
        @keyframes pulse-mini { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        textarea::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 pb-20 relative">

    <div id="login-modal" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center p-6 transition-opacity duration-300">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center">
            <div class="text-indigo-600 mb-4 flex justify-center">
                <i data-lucide="lock-keyhole" class="w-12 h-12"></i>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Acceso Profesional</h2>
            <p class="text-slate-500 text-sm mb-6">Sistema conectado a base de datos en tiempo real.</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                    <input type="email" id="login-email" placeholder="tucorreo@medico.com" required 
                        class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-10 pr-3 py-3 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <button id="btn-login" type="submit" class="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition-transform active:scale-95 disabled:opacity-50">
                    Verificar Acceso
                </button>
            </form>
            <p id="login-error" class="text-red-500 text-xs font-bold mt-4 hidden"></p>
        </div>
    </div>

    <header class="w-full max-w-md bg-white p-4 rounded-xl shadow-sm mb-4 flex justify-between items-center">
        <div class="flex items-center gap-2 text-indigo-700 font-bold text-xl">
            <i data-lucide="activity"></i> ClinicalV
        </div>
        <div class="flex items-center gap-2">
            <div id="user-badge" class="hidden md:block text-[10px] bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold uppercase tracking-wider">Activo</div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500" title="Cerrar Sesión">
                <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <div id="loader" class="fixed inset-0 bg-slate-900/90 z-50 hidden flex flex-col items-center justify-center text-white">
        <div class="w-12 h-12 border-4 border-white border-t-transparent rounded-full animate-spin mb-4"></div>
        <p id="loader-text" class="font-bold text-lg">Procesando...</p>
    </div>

    <main class="w-full max-w-md space-y-4 filter blur-sm transition-all duration-500" id="main-content">

        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl flex flex-col gap-3">
            <div class="flex items-center gap-2 text-indigo-800 font-bold text-sm uppercase tracking-wide">
                <i data-lucide="user-round-cog" class="w-4 h-4"></i> Datos del Médico
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="relative">
                    <i data-lucide="stethoscope" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="doc-name" placeholder="Nombre (Dr. Ejemplo)" class="w-full bg-white border-transparent rounded-lg pl-9 pr-3 py-2 text-sm outline-none font-semibold text-slate-700 placeholder-slate-400 focus:ring-2 focus:ring-indigo-200 transition-all" oninput="saveProfile()">
                </div>
                <div class="relative">
                    <i data-lucide="award" class="absolute left-3 top-2.5 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="doc-spec" placeholder="Especialidad (Ej: Cardiólogo)" class="w-full bg-white border-transparent rounded-lg pl-9 pr-3 py-2 text-sm outline-none text-slate-700 placeholder-slate-400 focus:ring-2 focus:ring-indigo-200 transition-all" oninput="saveProfile()">
                </div>
            </div>
        </div>

        <div id="section-patient" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
            <div class="space-y-3">
                <div class="relative">
                    <input type="text" id="nombre" placeholder="Nombre Paciente" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-3 pr-10 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-bold">
                    <button type="button" onclick="dictarCampo('nombre', this)" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 p-2 rounded-full transition-all z-10">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="relative">
                    <input type="tel" id="telefono" placeholder="WhatsApp (Ej: 0414...)" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-3 pr-10 py-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="dictarCampo('telefono', this)" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-indigo-600 p-2 rounded-full transition-all z-10">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="section-record" class="bg-white p-8 rounded-2xl shadow-lg text-center">
            <h2 class="text-slate-700 font-bold mb-2">Dictar Consulta</h2>
            <p class="text-slate-400 text-sm mb-6">Presiona el botón para empezar</p>
            
            <button type="button" id="btn-record" onclick="toggleRecord()" class="w-24 h-24 bg-indigo-600 rounded-full flex items-center justify-center text-white shadow-xl mx-auto transition-transform hover:scale-105 active:scale-95">
                <i data-lucide="mic" class="w-10 h-10"></i>
            </button>
            
            <p id="status" class="mt-6 text-indigo-600 font-medium h-6"></p>
        </div>

        <div id="section-edit" class="hidden bg-white p-6 rounded-2xl shadow-lg">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold text-slate-800">Resultados</h3>
                <button type="button" onclick="reset()" class="text-xs text-red-500 font-bold">NUEVA CONSULTA</button>
            </div>
            
            <div class="space-y-4">
                <div class="relative">
                    <label class="text-xs font-bold text-slate-400 mb-1 block">Diagnóstico</label>
                    <textarea id="txt-diag" class="w-full bg-slate-50 border rounded-lg pl-3 pr-10 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 min-h-[60px]"></textarea>
                    <button type="button" onclick="dictarCampo('txt-diag', this)" class="absolute right-2 top-8 text-slate-400 hover:text-indigo-600 p-2 rounded-full z-10">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="relative">
                    <label class="text-xs font-bold text-slate-400 mb-1 block">Plan / Tratamiento</label>
                    <textarea id="txt-plan" class="w-full bg-slate-50 border rounded-lg pl-3 pr-10 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 min-h-[80px]"></textarea>
                    <button type="button" onclick="dictarCampo('txt-plan', this)" class="absolute right-2 top-8 text-slate-400 hover:text-indigo-600 p-2 rounded-full z-10">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="relative">
                    <label class="text-xs font-bold text-slate-400 mb-1 block">Indicaciones</label>
                    <textarea id="txt-ind" class="w-full bg-slate-50 border rounded-lg pl-3 pr-10 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 min-h-[60px]"></textarea>
                    <button type="button" onclick="dictarCampo('txt-ind', this)" class="absolute right-2 top-8 text-slate-400 hover:text-indigo-600 p-2 rounded-full z-10">
                        <i data-lucide="mic" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <div class="mt-8 space-y-3">
                <button type="button" onclick="sendSmartReport()" class="w-full py-4 bg-green-500 text-white font-bold rounded-xl shadow-md hover:bg-green-600 flex items-center justify-center gap-2 transition-transform active:scale-95">
                    <i data-lucide="send"></i> Enviar Informe (Automático)
                </button>

                <button type="button" onclick="generatePDF()" class="w-full py-3 bg-slate-800 text-white font-bold rounded-xl shadow-md hover:bg-slate-900 flex items-center justify-center gap-2 transition-transform active:scale-95">
                    <i data-lucide="file-text"></i> Descargar PDF Local
                </button>
                
                <button type="button" onclick="copyText()" class="w-full py-3 bg-white border border-slate-200 text-slate-600 font-bold rounded-xl hover:bg-slate-50 flex items-center justify-center gap-2">
                    <i data-lucide="copy"></i> Copiar Texto
                </button>
            </div>
        </div>

    </main>

    <script>
        // --- TUS CREDENCIALES ---
        const SUPABASE_URL = 'https://hlhopwhvntevmqmndthv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsaG9wd2h2bnRldm1xbW5kdGh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1MDU2MzQsImV4cCI6MjA3NDA4MTYzNH0.wwt2gjRokyQnUwYIApHwOS6WA_a2p-dCrLQ75MJOU64';
        
        // WEBHOOK 1: Para procesar el audio (el que ya tienes configurado)
        const N8N_AUDIO_WEBHOOK = 'https://general-empresas-n8n.w06teu.easypanel.host/webhook/24d6b820-8227-4167-a747-f6be56cd7c34';
        
        // WEBHOOK 2: Para ENVIAR el mensaje (Debes crear este en n8n)
        const N8N_SEND_WEBHOOK = 'https://general-empresas-n8n.w06teu.easypanel.host/webhook/71751b00-c085-4acc-934e-f9ea1b87b81e'; 

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        window.onload = () => { lucide.createIcons(); checkAuth(); };

        // --- 1. FUNCIÓN DE LIMPIEZA DE TEXTO (SOLUCIÓN AL TEXTO RARO) ---
        function cleanTextForPDF(text) {
            if (!text) return "";
            // Esto elimina asteriscos, emojis y símbolos raros, dejando solo texto limpio
            return text
                .toString()
                .replace(/\*/g, "") // Quita los asteriscos de negrita
                .replace(/[^\w\s.,;:()áéíóúÁÉÍÓÚñÑüÜ\-\/]/g, "") // Solo permite letras español, números y puntuación
                .replace(/\s+/g, " ") // Elimina espacios dobles
                .trim();
        }

        // --- SISTEMA DE LOGIN ---
        function checkAuth() {
            const isAuth = localStorage.getItem('clinicalv_auth');
            const modal = document.getElementById('login-modal');
            const main = document.getElementById('main-content');
            if (isAuth === 'true') {
                modal.classList.add('hidden');
                main.classList.remove('blur-sm');
                loadProfile(); 
            } else {
                modal.classList.remove('hidden');
                main.classList.add('blur-sm');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const emailInput = document.getElementById('login-email').value.toLowerCase().trim();
            const btnLogin = document.getElementById('btn-login');
            btnLogin.innerText = "Verificando..."; btnLogin.disabled = true;
            try {
                const { data, error } = await supabaseClient.from('medicos_autorizados').select('*').eq('email', emailInput).single(); 
                if (error || !data || !data.activo) throw new Error("Acceso denegado");
                localStorage.setItem('clinicalv_auth', 'true');
                checkAuth();
            } catch (err) {
                alert("🚫 Acceso Denegado");
            } finally {
                btnLogin.innerText = "Verificar Acceso"; btnLogin.disabled = false;
            }
        }
        function logout() { if(confirm("¿Salir?")) { localStorage.removeItem('clinicalv_auth'); location.reload(); } }
        function saveProfile() { localStorage.setItem('clinicalv_doc_name', document.getElementById('doc-name').value); localStorage.setItem('clinicalv_doc_spec', document.getElementById('doc-spec').value); }
        function loadProfile() { 
            if(localStorage.getItem('clinicalv_doc_name')) document.getElementById('doc-name').value = localStorage.getItem('clinicalv_doc_name');
            if(localStorage.getItem('clinicalv_doc_spec')) document.getElementById('doc-spec').value = localStorage.getItem('clinicalv_doc_spec');
        }

        // --- LÓGICA DE ENVÍO AUTOMÁTICO (CORREGIDA) ---
async function sendSmartReport() {
            const btn = document.querySelector('button[onclick="sendSmartReport()"]');
            const originalText = btn.innerHTML;
            
            const phone = document.getElementById('telefono').value.replace(/\D/g, '');
            // Usamos la limpieza normal para el texto del PDF
            const patientName = cleanTextForPDF(document.getElementById('nombre').value) || "Paciente";
            const docName = cleanTextForPDF(document.getElementById('doc-name').value) || "Su Médico";
            
            if(!phone) return alert("⚠️ Falta el teléfono del paciente");
            let finalPhone = phone;
            if(phone.length === 11 && phone.startsWith('0')) finalPhone = '58' + phone.substring(1);
            else if(phone.length === 10) finalPhone = '58' + phone;

            btn.innerHTML = '<i class="animate-spin">⏳</i> Generando...';
            btn.disabled = true;

            try {
                // --- Generar PDF ---
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const docSpec = cleanTextForPDF(document.getElementById('doc-spec').value) || "Medicina General";
                const diag = cleanTextForPDF(document.getElementById('txt-diag').value);
                const plan = cleanTextForPDF(document.getElementById('txt-plan').value);
                const ind = cleanTextForPDF(document.getElementById('txt-ind').value);
                const date = new Date().toLocaleDateString("es-VE");

                doc.setFontSize(18); doc.setTextColor(79, 70, 229); doc.text(`Dr. ${docName}`, 20, 20);
                doc.setFontSize(10); doc.setTextColor(100); doc.text(docSpec.toUpperCase(), 20, 26);
                doc.setDrawColor(200); doc.line(20, 30, 190, 30);
                doc.setFontSize(12); doc.setTextColor(0); doc.text(`Fecha: ${date}`, 140, 40); doc.text(`Paciente: ${patientName}`, 20, 40);

                let yPos = 55;
                const addSection = (title, content) => {
                    if(!content) return;
                    doc.setFontSize(11); doc.setFont(undefined, 'bold'); doc.text(title, 20, yPos); yPos += 7;
                    doc.setFont(undefined, 'normal');
                    const splitText = doc.splitTextToSize(content, 170);
                    doc.text(splitText, 20, yPos); 
                    yPos += (splitText.length * 5) + 10;
                };
                
                addSection("DIAGNÓSTICO:", diag);
                addSection("PLAN / TRATAMIENTO:", plan);
                addSection("INDICACIONES:", ind);
                doc.setFontSize(8); doc.setTextColor(150); doc.text("Generado vía ClinicalV", 20, 280);

                const pdfBlob = doc.output('blob');

                // --- Subir a Supabase (CORRECCIÓN AQUÍ) ---
                btn.innerHTML = '<i class="animate-spin">☁️</i> Subiendo...';
                
                // 1. Quitamos acentos y caracteres raros SOLO para el nombre del archivo
                const safeName = patientName
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // José -> Jose
                    .replace(/[^a-zA-Z0-9]/g, "_"); // Símbolos -> _
                
                const fileName = `${Date.now()}_${safeName}.pdf`;

                const { data, error } = await supabaseClient.storage.from('informes').upload(fileName, pdfBlob, { contentType: 'application/pdf', upsert: false });
                
                if (error) {
                    console.error("Error Supabase:", error);
                    // Si el error es de permisos, avisamos. Si es otro, mostramos el técnico.
                    if(error.message.includes("violates row-level security")) {
                        throw new Error("Error de permisos. Ejecuta el SQL en Supabase.");
                    } else {
                        throw new Error("Error subiendo: " + error.message);
                    }
                }

                const { data: publicData } = supabaseClient.storage.from('informes').getPublicUrl(fileName);
                const publicPDFLink = publicData.publicUrl;

// --- Enviar a n8n (MODO FORMULARIO PARA EVITAR ERROR 500/CORS) ---
                btn.innerHTML = '<i class="animate-spin">🚀</i> Enviando...';
                
                if (N8N_SEND_WEBHOOK.includes('PON_AQUI')) throw new Error("Falta configurar el Webhook");

                // 1. Creamos un "Formulario Virtual"
                const formData = new URLSearchParams();
                formData.append("phone", finalPhone);
                formData.append("patient", patientName);
                formData.append("doctor", docName);
                formData.append("link", publicPDFLink);

                // 2. Enviamos como 'application/x-www-form-urlencoded'
                // Esto es una "Simple Request". El navegador NO hace preguntas de seguridad complicadas.
                await fetch(N8N_SEND_WEBHOOK, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                alert("✅ Informe enviado exitosamente.");

            } catch (err) {
                console.error(err);
                alert("❌ Error: " + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }


        // --- GENERAR PDF LOCAL (Respaldo) ---
        function generatePDF() {
             const { jsPDF } = window.jspdf;
             const doc = new jsPDF();
             const docName = cleanTextForPDF(document.getElementById('doc-name').value) || "Medico";
             const patientName = cleanTextForPDF(document.getElementById('nombre').value) || "Paciente";
             const diag = cleanTextForPDF(document.getElementById('txt-diag').value);
             
             doc.text(`Dr. ${docName}`, 20, 20);
             doc.text(`Paciente: ${patientName}`, 20, 30);
             
             const splitDiag = doc.splitTextToSize(diag, 170);
             doc.text(splitDiag, 20, 50);
             
             doc.save("Resumen_Medico.pdf");
        }

        let mediaRecorder; let audioChunks = []; let isRecording = false;

        async function toggleRecord() {
            const btn = document.getElementById('btn-record');
            const status = document.getElementById('status');
            if(!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => { stream.getTracks().forEach(track => track.stop()); processAudio(); };
                    mediaRecorder.start(); isRecording = true;
                    btn.classList.add('recording-main'); btn.innerHTML = '<i data-lucide="square" class="w-10 h-10 fill-current"></i>';
                    status.textContent = "Escuchando...";
                    lucide.createIcons();
                } catch(err) { alert("Permiso micrófono denegado"); }
            } else {
                mediaRecorder.stop(); isRecording = false;
                btn.classList.remove('recording-main'); btn.innerHTML = '<i data-lucide="mic" class="w-10 h-10"></i>';
                status.textContent = "Procesando...";
                lucide.createIcons();
            }
        }

        async function processAudio() {
            const loader = document.getElementById('loader'); loader.classList.remove('hidden');
            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = async () => {
                const base64 = reader.result.split(',')[1];
                try {
                    const res = await fetch(N8N_AUDIO_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ audio: base64, mimeType: 'audio/webm' }) });
                    if(!res.ok) throw new Error("Error AI");
                    const data = await res.json();
                    const output = data.output || data; 
                    if (output.nombre_paciente) document.getElementById('nombre').value = output.nombre_paciente;
                    if (output.telefono_paciente) document.getElementById('telefono').value = output.telefono_paciente;
                    document.getElementById('txt-diag').value = `MOTIVO: ${output.motivo || ''}\n\nDX: ${output.diagnostico || ''}`;
                    document.getElementById('txt-plan').value = output.plan || '';
                    document.getElementById('txt-ind').value = output.recomendaciones_y_precauciones || '';
                    document.getElementById('section-record').classList.add('hidden');
                    document.getElementById('section-edit').classList.remove('hidden');
                    resizeAllTextareas();
                } catch(err) { alert(err.message); } finally { loader.classList.add('hidden'); }
            };
        }

        function dictarCampo(id, btn) {
            if (!('webkitSpeechRecognition' in window)) return alert("Usa Chrome");
            const r = new webkitSpeechRecognition(); r.lang = 'es-ES'; r.interimResults = false;
            btn.classList.add('mic-active');
            r.onresult = e => { document.getElementById(id).value = e.results[0][0].transcript; resizeAllTextareas(); };
            r.onend = () => btn.classList.remove('mic-active');
            r.start();
        }

        function copyText() {
            const msg = `PACIENTE: ${document.getElementById('nombre').value}\n\nDX:\n${document.getElementById('txt-diag').value}\n\nPLAN:\n${document.getElementById('txt-plan').value}`;
            navigator.clipboard.writeText(msg).then(() => alert("Copiado"));
        }
        function reset() {
            if(confirm("¿Nueva consulta?")) {
                document.getElementById('section-record').classList.remove('hidden');
                document.getElementById('section-edit').classList.add('hidden');
                ['nombre','telefono','txt-diag','txt-plan','txt-ind'].forEach(id => document.getElementById(id).value = '');
            }
        }
        function resizeAllTextareas() { document.querySelectorAll('textarea').forEach(el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }); }
    </script>
</body>
</html>
